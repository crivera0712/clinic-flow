services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_flow}
      POSTGRES_USER: ${POSTGRES_USER:-clinicflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicflow} -d ${POSTGRES_DB:-clinic_flow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-clinic_flow}
      DB_USER: ${POSTGRES_USER:-clinicflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-clinicflow}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      SPRING_JWT_COOKIESECURE: ${SPRING_JWT_COOKIESECURE:-false}
      SPRING_JWT_COOKIESAMESITE: ${SPRING_JWT_COOKIESAMESITE:-Lax}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
