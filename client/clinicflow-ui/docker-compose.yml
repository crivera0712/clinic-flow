services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_CLINIC_SLUG: ${VITE_CLINIC_SLUG:-demo}
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:8080}
    ports:
      - "5173:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
